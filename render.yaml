services:
  # ----------------------------------------------------
  # Backend Web Service (Node / Express)
  # ----------------------------------------------------
  - type: web
    name: resqfood-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SSL
        value: "true"
      # Aiven Cloud MySQL connection URL
      - key: DATABASE_URL
        sync: false

  # ----------------------------------------------------
  # Frontend Static Site (Vite / React SPA)
  # ----------------------------------------------------
  - type: web
    name: resqfood-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://resqfood-backend-lnqi.onrender.com

